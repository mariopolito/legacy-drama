name: Check the data files

on:
  push:
    paths: ['data/**.json']
  pull_request:
    paths: ['data/**.json']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = False
          for path in sorted(pathlib.Path('data').glob('*.json')):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'OK   {path}')
              except json.JSONDecodeError as err:
                  bad = True
                  print(f'FAIL {path}: line {err.lineno}, column {err.colno}: {err.msg}')
          sys.exit(1 if bad else 0)
          PY
